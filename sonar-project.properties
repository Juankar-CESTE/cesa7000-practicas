# sonar-project.properties (Tema 9): configuración del análisis de SonarQube. Va en la raíz del repositorio
# y lo leen los dos pipelines: el Sonar Scanner de Jenkins y la acción de GitHub Actions.

# Identificador del proyecto en SonarQube: tiene que coincidir con la clave que se crea en el panel.
# (En SonarQube Cloud la clave es del tipo usuario_repositorio y la pasa Actions con -Dsonar.projectKey.)
sonar.projectKey=calculadora
sonar.projectName=Calculadora CESA7000

# Dónde está el código y dónde están los tests
sonar.sources=src
sonar.tests=tests

# Informe de cobertura que genera npm test (Jest, formato lcov). La etapa de tests tiene que ir antes.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
