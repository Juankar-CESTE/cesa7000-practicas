# Workflow equivalente al Jenkinsfile (Tema 7, clase 8):
# las mismas cuatro fases (Clonar, Tests, Build imagen Docker y Publicar)
# repartidas en dos jobs (test y docker).
name: CI

on:
  # Disparadores nativos de GitHub (equivalen a Poll SCM o webhook en Jenkins)
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lanzamiento manual con formulario (equivale a parameters en Jenkins)
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Subir la imagen a DockerHub'
        type: boolean
        default: true

jobs:
  # Job test: agrupa las fases de Clonar y Tests (runs-on equivale a agent any)
  test:
    runs-on: ubuntu-latest
    steps:
      # Clonar: equivale a stage('Clonar') / checkout scm en Jenkinsfile
      - uses: actions/checkout@v6

      # Tests: equivale a stage('Tests') en Jenkinsfile
      # actions/setup-node equivale a tools { nodejs 'node24' } en Jenkins
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

      # Guarda el informe de tests y la cobertura como artefacto (equivale a archiveArtifacts en
      # Jenkins). if: always() lo sube también si los tests fallan. En Actions solo se descarga
      # como zip; no se visualiza en la plataforma como en Jenkins.
      - name: Guardar resultados de test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-tests
          path: |
            reports/
            coverage/lcov-report/

  # Job docker: agrupa las fases de Build imagen Docker y Publicar
  docker:
    # Espera a que test termine en verde (sin needs los jobs se ejecutan en paralelo)
    needs: test
    # Equivale a when en Jenkins: en una PR no se construye ni se publica imagen
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Variables del job (equivale a environment en Jenkins)
    env:
      # Variable del repositorio (Settings > Secrets and variables > Actions > Variables)
      IMAGEN: ${{ vars.IMAGEN }}
      # Etiqueta propia de Actions; latest lo mantiene solo Jenkins para no pisarse
      VERSION: gha-${{ github.run_number }}
      # En push a main publica siempre; en ejecución manual usa el input publicar
      PUBLICAR: ${{ github.event_name == 'push' || inputs.publicar }}
    steps:
      # Clonar (repetido): cada job corre en una máquina nueva y limpia y no comparte ficheros con test
      - uses: actions/checkout@v6

      # Build imagen Docker: equivale a stage('Build imagen') en Jenkinsfile
      - name: Build imagen
        run: docker build -t "$IMAGEN:$VERSION" .

      # Seguridad: equivale a stage('Seguridad') en Jenkinsfile. Trivy analiza la imagen recién construida
      # antes de publicar; falla solo con vulnerabilidades críticas que ya tengan corrección. Si falla, Login y
      # Publicar no se ejecutan, igual que en Jenkins.
      # Cadena de suministro (Tema 9): en marzo de 2026 movieron las etiquetas de esta acción a código malicioso.
      # Por eso se fija por el SHA del COMMIT (una etiqueta se puede mover, un SHA no) y se fija también la
      # versión de Trivy, la misma que en Jenkins. El SHA ha de ser el del commit, no el del objeto de la etiqueta
      # anotada (git rev-parse v0.36.0^{commit}); si no, falla con "Unable to resolve action".
      - name: Seguridad (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGEN }}:${{ env.VERSION }}
          version: v0.76.2
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # Publicar: equivale a stage('Publicar') en Jenkinsfile (login con secrets y docker push)
      # docker/login-action usa secrets (equivale a withCredentials) y cierra sesión al terminar el job (equivale a post { always { docker logout } })
      - name: Login en DockerHub
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar
        if: env.PUBLICAR == 'true'
        run: docker push "$IMAGEN:$VERSION"
